<div class="app-shell" [class.light-mode]="theme === 'light'">
  <app-hero (scrollToGuide)="scrollToGuide()"></app-hero>

  <main class="wrap" id="guide-content">
    <app-guide-menu
      [tabs]="tabs"
      [theme]="theme"
      [activeTab]="activeTab"
      [isUserMenuOpen]="isUserMenuOpen"
      (tabSelected)="setActiveTab($event)"
      (themeToggled)="toggleTheme()"
      (userMenuToggled)="toggleUserMenu()"
      (logoutClicked)="logout()"
    ></app-guide-menu>

    <div class="grid">
      <app-guide-sidebar
        [activeTab]="activeTab"
        [badges]="badges"
      ></app-guide-sidebar>

      <section class="content">
        <app-overview-section
          *ngIf="isActiveTab('overview')"
          (cardMouseMove)="onMouseMove($event)"
        ></app-overview-section>

        <app-basics-section
          *ngIf="isActiveTab('basics')"
          (imageSelected)="openImage($event)"
        ></app-basics-section>

        <app-ls-section
          *ngIf="isActiveTab('ls')"
          (cardMouseMove)="onMouseMove($event)"
        ></app-ls-section>

        <app-chmod-section
          *ngIf="isActiveTab('chmod')"
          (cardMouseMove)="onMouseMove($event)"
        ></app-chmod-section>

        <app-grep-section
          *ngIf="isActiveTab('grep')"
          (cardMouseMove)="onMouseMove($event)"
        ></app-grep-section>

        <app-sed-section
          *ngIf="isActiveTab('sed')"
        ></app-sed-section>

        <app-awk-section
          *ngIf="isActiveTab('awk')"
          (cardMouseMove)="onMouseMove($event)"
        ></app-awk-section>

        <app-c-section
          *ngIf="isActiveTab('c')"
          (cardMouseMove)="onMouseMove($event)"
        ></app-c-section>

        <app-quiz-section
          *ngIf="isActiveTab('quiz')"
          [quizQuestions]="quizQuestions"
          (cardMouseMove)="onMouseMove($event)"
        ></app-quiz-section>
      </section>
    </div>
  </main>

  <app-footer></app-footer>

  <app-scroll-top-button
    *ngIf="showScrollTop"
    (scrollTop)="scrollToTop()"
  ></app-scroll-top-button>

  <app-image-modal
    *ngIf="selectedImage"
    [selectedImage]="selectedImage"
    (closed)="closeImage()"
  ></app-image-modal>
</div>
