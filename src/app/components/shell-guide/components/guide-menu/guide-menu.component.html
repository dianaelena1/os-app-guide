<div class="guide-menu-wrap">
    <div class="top-actions">
        <button type="button" class="top-icon" (click)="themeToggled.emit()">
            {{ theme === 'dark' ? '☀️' : '🌙' }}
        </button>

        <div class="user-menu">
            <button
                    type="button"
                    class="top-user"
                    (click)="userMenuToggled.emit()"
                    *ngIf="displayName$ | async as displayName"
            >
                <span class="user-symbol">👤</span>
            </button>

            <div class="user-dropdown" *ngIf="isUserMenuOpen">
                <button type="button" (click)="openSettings()">Settings</button>
                <button type="button" (click)="logoutClicked.emit()">Log out</button>
            </div>
        </div>
    </div>

    <nav class="floating-menu">
        <button
                type="button"
                class="menu-arrow left"
                aria-label="Scroll menu left"
                (click)="scrollTabs(-500)"
        >
            ‹
        </button>

        <div #tabsContainer class="menu-left">
            <button
                    *ngFor="let tab of tabs"
                    type="button"
                    class="menu-tab"
                    [class.active]="activeTab === tab.id"
                    [class.exam-tab]="tab.id === 'exam'"
                    [class.grades-tab]="tab.id === 'grades'"
                    (click)="handleTabClick(tab.id)"
            >
                {{ tab.label }}
            </button>
        </div>

        <button
                type="button"
                class="menu-arrow right"
                aria-label="Scroll menu right"
                (click)="scrollTabs(500)"
        >
            ›
        </button>
    </nav>
</div>
