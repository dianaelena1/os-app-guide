<section class="intro-hero">
  <div class="hero-blobs">
    <span class="blob blob-green"></span>
    <span class="blob blob-blue"></span>
    <span class="blob blob-purple"></span>
    <span class="blob blob-orange"></span>
  </div>

  <div class="intro-content">
      <p class="welcome-text" *ngIf="displayName$ | async as displayName">
          Welcome, {{ displayName }} to
      </p>
    <h2 class="typing-title" aria-label="Operating Systems Guide">
      <span class="typing-text">Operating Systems Guide</span>
    </h2>

    <div class="hero-pill hero-reveal delay-1">
      Linux • Shell scripting • C programming
    </div>

    <p class="hero-reveal delay-2">
      Un ghid interactiv pentru laborator, cu exemple clare,
      cheatsheets și quiz-uri pentru studenți.
    </p>

    <button
  type="button"
  class="scroll-hint hero-reveal delay-3"
  (click)="scrollToGuide.emit()"
>
  <span>Scroll to start</span>
</button>
  </div>
</section>
