<div class="login-page">
  <div class="login-card">
    <h2>Log in</h2>

    <p>Autentifică-te pentru a intra în ghid.</p>

    <form class="login-form" (ngSubmit)="login()">
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Email"
      />

      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Parola"
      />

      <button type="submit">
        Log in
      </button>
    </form>

    <p class="login-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>
  </div>
</div>
