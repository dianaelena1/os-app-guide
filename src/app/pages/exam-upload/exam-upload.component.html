<div class="exam-page">
  <section class="exam-card">
    <div class="exam-header">
      <div>
        <p class="eyebrow">Operating Systems</p>
        <h1>
            Examen Practic
            <span *ngIf="displayName$ | async as displayName">
                {{ displayName }}
        </span>
        </h1>

        <p class="description">
          Încarcă aici cele două fișiere cerute pentru examen.
          Fiecare fișier poate avea maxim 5MB.
        </p>
      </div>

      <a
        class="github-link"
        href="https://github.com/dianaelena1/Operating-Systems/tree/homework/Exam/examples"
        target="_blank"
        rel="noopener noreferrer"
      >
        Exemple GitHub
      </a>
    </div>

    

    <div class="upload-grid">
  <label class="upload-box">
    <span class="file-number">1</span>

    <strong>Problema Shell Scripting</strong>
    <small>Alege primul fișier pentru examen.</small>

    <div class="custom-file-row">
      <span class="custom-file-button">Alege fișier</span>

      <span class="custom-file-name">
        {{ file1 ? file1.name : 'Niciun fișier selectat' }}
      </span>
    </div>

    <input
      class="hidden-file-input"
      type="file"
      (change)="onFileSelected($event, 1)"
    />
  </label>

  <label class="upload-box">
    <span class="file-number">2</span>

    <strong>Problema C</strong>
    <small>Alege al doilea fișier pentru examen.</small>

    <div class="custom-file-row">
      <span class="custom-file-button">Alege fișier</span>

      <span class="custom-file-name">
        {{ file2 ? file2.name : 'Niciun fișier selectat' }}
      </span>
    </div>

    <input
      class="hidden-file-input"
      type="file"
      (change)="onFileSelected($event, 2)"
    />
  </label>
</div>


    <button
      type="button"
      class="submit-button"
      [disabled]="isUploading"
      (click)="submitFiles()"
    >
      {{ isUploading ? 'Se încarcă...' : 'Trimite fișierele' }}
    </button>

    <p class="success" *ngIf="successMessage">
      {{ successMessage }}
    </p>

    <p class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

    <a class="back-link" routerLink="/">
      Înapoi la ghid
    </a>
  </section>
</div>
